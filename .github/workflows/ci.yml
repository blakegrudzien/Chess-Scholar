name: Lint and test

# Lint and tests on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both ends of the supported range (requires-python = ">=3.11").
      matrix:
        python-version: ["3.11", "3.12"]
    # The database tests skip when no Postgres is reachable, and a skip
    # isn't a failure, so CI provides one; the pgvector image covers the
    # tests that need vectors too.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The tests connect with only a dbname; psycopg2 takes the rest from
      # these standard libpq variables.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          echo "/usr/games" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # pip installs Playwright but not its browser. Without the browser the
      # board, tour and layout tests skip and CI stays green untested.
      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check requirements.txt matches pyproject.toml
        run: python -m scripts.check_requirements_sync

      # Coverage makes an untested module visible. No minimum is set yet.
      - name: Test
        run: pytest -v tests --cov=src --cov-report=term-missing
