name: Keep Streamlit app awake

on:
  schedule:
    # Daily. Streamlit Community Cloud puts idle apps to sleep after a period
    # of no traffic; this is a resume-linked demo, so it needs to stay warm
    # for a recruiter clicking in cold.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            --max-time 60 --retry 3 --retry-delay 10 \
            https://chess-rag-blake.streamlit.app/
