name: Keep Streamlit app awake

on:
  schedule:
    # Every 8 hours: Streamlit Community Cloud puts idle apps to sleep (one
    # was asleep about 27 hours after its last visit), and scheduled runs
    # often start late, so daily would be cutting it close.
    - cron: "0 */8 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app with a real browser
        # A real browser: only a full page load with the WebSocket session
        # counts as a visit (see the script's docstring).
        run: python scripts/keep_streamlit_awake.py
