name: Keep Streamlit app awake

on:
  schedule:
    # Daily. Streamlit Community Cloud puts idle apps to sleep after a period
    # of no traffic; this is a resume-linked demo, so it needs to stay warm
    # for a recruiter clicking in cold.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app with a real browser
        # Not curl: confirmed live that a curl ping "succeeding" daily for
        # days straight did not stop the app from going to sleep -- curl
        # never establishes the real page-load + WebSocket session
        # Streamlit Cloud actually tracks as a visit. See the script's own
        # docstring for the full story.
        run: python scripts/keep_streamlit_awake.py
