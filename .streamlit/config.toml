# A public app should never show visitors a Python traceback (file paths,
# library internals). Full errors still reach the logs.
[client]
showErrorDetails = "none"

# A PGN of thousands of games fits in 1MB; Streamlit's 200MB default would
# let a few large uploads run the server out of memory.
[server]
maxUploadSize = 1

# Walnut, oxblood and parchment: a chess study, not a SaaS dashboard.
#
# secondaryBackgroundColor stays light because Streamlit uses the one dark
# textColor on it; dark panels (code and PGN blocks) use the code colors.
[theme]
base = "light"
primaryColor = "#6B1E2B"
backgroundColor = "#E8DCC3"
secondaryBackgroundColor = "#F1E8D4"
textColor = "#2B1F17"
borderColor = "#A88F72"

font = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
codeFont = "'Space Mono':https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"

headingFontWeights = [600, 500, 500, 500, 500, 500]
codeTextColor = "#EDE1CC"
codeBackgroundColor = "#2B1F17"

baseRadius = "2px"
buttonRadius = "2px"
