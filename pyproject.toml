[project]
name = "chess-rag"
version = "0.1.0"
description = "Hybrid structured-search + RAG chess assistant"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.999",
    "anthropic>=0.40",
    "openai>=1.50",           # used for embeddings only (text-embedding-3-small)
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
