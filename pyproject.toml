[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-scholar"
version = "0.1.0"
description = "Hybrid structured-search + RAG chess assistant"
license = "MIT"
requires-python = ">=3.11"
# This is the source of truth for runtime dependencies. requirements.txt at
# the repo root duplicates this list by hand for Streamlit Community Cloud,
# which reads requirements.txt specifically and can't be pointed at this
# file. Update both when changing a dependency.
dependencies = [
    "python-chess>=1.999",
    "anthropic>=0.40",
    "voyageai>=0.3",          # embeddings (Anthropic's recommended partner; no first-party model)
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",        # not currently imported anywhere -- kept for a planned
                              # future ingestion/file-processing pass, not leftover cruft
    "pgvector>=0.3",
    # Capped, not open-ended: src/ui/styles.py targets one Streamlit-internal,
    # unversioned Emotion CSS class by exact generated name, which a future
    # release could rename with no error, just a silent visual regression
    # (see that file's own comment). Verified against 1.38-1.59; bump this
    # ceiling deliberately, re-checking that selector, not as a side effect
    # of an unrelated dependency update.
    "streamlit>=1.38,<1.60",
    "python-dotenv>=1.0",
    "pydantic>=2.8",          # not currently imported anywhere -- same as sqlalchemy above
    "httpx>=0.27",            # direct HTTP calls to the Lichess API (declared explicitly even
                               # though anthropic already pulls it in transitively -- code that
                               # imports httpx directly should not rely on another package's
                               # dependency tree to keep it available)
    "beautifulsoup4>=4.12",   # parses Lichess's study-listing HTML (no API covers it) --
                               # hand-rolled regex/string parsing of nested, attribute-bearing
                               # HTML is a well-known reliability trap, so this uses a real parser
    "scikit-learn>=1.4",      # quality classifier: logistic regression / gradient boosting +
                               # cross-validation for the study recommendation feature
    "joblib>=1.3",            # serializes the fitted classifier pipeline to disk -- declared
                               # explicitly even though scikit-learn pulls it in transitively,
                               # since this code imports it directly (same reasoning as httpx)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "playwright>=1.40",  # real-browser coverage for the draggable board
                         # (tests/test_board_component.py) -- dev/test-only,
                         # deliberately not in [project.dependencies] or
                         # requirements.txt, which is what Streamlit
                         # Community Cloud reads to deploy the app itself.
                         # Also requires a one-time `playwright install
                         # chromium` -- not expressible as a pip dependency.
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S (flake8-bandit) is included deliberately: this app is deployed publicly
# with no authentication and handles untrusted input (uploaded PGNs, model-
# supplied tool arguments), so the security lints are worth enforcing rather
# than relying on review to catch the same classes of problem by eye.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assert-based style is the point of the framework.
# S603/S607: test_board_component.py launches the app under test via
# `streamlit run` with a fixed, literal argv and no caller-supplied input;
# resolving an absolute interpreter path would only make the test brittle
# across environments. None of this ships with the deployed app.
"tests/*" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
